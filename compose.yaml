services:
  jupyter:
    build:
      context: .
      args:
        OPENSYSML_KERNEL_VERSION: "0.9.3.dev20261008"
        OPENCODE_VERSION: "1.19.4"
    user: root
    working_dir: /home/keio/work
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/keio/work
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-opensysml}"
      NB_USER: keio
      CHOWN_HOME: "yes"
      CHOWN_EXTRA: /home/keio/work/notebooks,/home/keio/work/models,/home/keio/state
      CHOWN_EXTRA_OPTS: "-R"
      HOME: /home/keio
      XDG_DATA_HOME: /home/keio/state/data
      XDG_CONFIG_HOME: /home/keio/state/config
      XDG_CACHE_HOME: /home/keio/state/cache
      XDG_STATE_HOME: /home/keio/state/state
      OPENCODE_CONFIG: /opt/course/opencode/opencode.json
      OPENCODE_DISABLE_AUTOUPDATE: "true"
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ${JUPYTER_WORKSPACE:-./workspace}:/home/keio/work
      - ${JUPYTER_WORKSPACE:-./workspace}/samples:/home/keio/work/samples:ro
      - opencode-state:/home/keio/state
    restart: unless-stopped

volumes:
  opencode-state:
